schema_version: craftmake.action/v1
name: accel_test
backend: colab
colab:
  session: nodrive
  auth_config: .craftmake/colab-auth.json
  default_accelerator: cpu
jobs:
  cpu1:
    accelerator: cpu
    steps:
      - run: |
          python3 - << 'EOF'
          import os, platform, torch
          print('=== STAGE 1: CPU ===')
          print('Platform:', platform.platform())
          print('Processors:', os.cpu_count())
          print('CUDA available:', torch.cuda.is_available())
          EOF
  gpu:
    accelerator: gpu
    needs: [cpu1]
    steps:
      - run: |
          python3 - << 'EOF'
          import os, platform, torch
          print('=== STAGE 2: GPU ===')
          print('Platform:', platform.platform())
          print('CUDA available:', torch.cuda.is_available())
          if torch.cuda.is_available():
              print('Device count:', torch.cuda.device_count())
              print('Device name:', torch.cuda.get_device_name(0))
              x = torch.randn(1000, 1000, device='cuda')
              y = torch.matmul(x, x)
              print('GPU Matmul successful, shape:', y.shape)
          EOF
  cpu2:
    accelerator: cpu
    needs: [gpu]
    steps:
      - run: |
          python3 - << 'EOF'
          import os, platform, torch
          print('=== STAGE 3: CPU ===')
          print('Platform:', platform.platform())
          print('CUDA available:', torch.cuda.is_available())
          print('All 3 stages verified across CPU and GPU instances!')
          EOF
