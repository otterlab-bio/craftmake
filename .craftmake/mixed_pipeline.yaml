schema_version: craftmake.action/v1
name: mixed_pipeline
backend: colab
colab:
  session: gpu
  default_accelerator: cpu
  drive_root: /content/drive/MyDrive/craftmake
jobs:
  preprocess:
    accelerator: cpu
    steps:
      - run: |
          python3 - << 'EOF'
          import os
          from pathlib import Path
          from google.colab import drive
          if not os.path.ismount('/content/drive'):
              drive.mount('/content/drive', force_remount=False)
          base = Path('/content/drive/MyDrive/craftmake')
          base.mkdir(parents=True, exist_ok=True)
          (base / 'stage.txt').write_text('preprocess-done')
          print('CPU preprocess wrote stage.txt to Drive')
          print('stage content:', (base / 'stage.txt').read_text())
          EOF
  train:
    accelerator: gpu
    needs: [preprocess]
    steps:
      - run: |
          python3 - << 'EOF'
          import os
          from pathlib import Path
          from google.colab import drive
          if not os.path.ismount('/content/drive'):
              drive.mount('/content/drive', force_remount=False)
          base = Path('/content/drive/MyDrive/craftmake')
          stage = (base / 'stage.txt').read_text()
          print('GPU train read stage:', stage)
          import torch
          print('CUDA available:', torch.cuda.is_available())
          if torch.cuda.is_available():
              print('GPU device:', torch.cuda.get_device_name(0))
          (base / 'model.txt').write_text('trained-on-gpu')
          print('GPU train wrote model.txt to Drive')
          EOF
  report:
    accelerator: cpu
    needs: [train]
    steps:
      - run: |
          python3 - << 'EOF'
          import os
          from pathlib import Path
          from google.colab import drive
          if not os.path.ismount('/content/drive'):
              drive.mount('/content/drive', force_remount=False)
          base = Path('/content/drive/MyDrive/craftmake')
          stage = (base / 'stage.txt').read_text()
          model = (base / 'model.txt').read_text()
          print('CPU report read stage:', stage)
          print('CPU report read model:', model)
          print('PIPELINE COMPLETE: cpu -> gpu -> cpu data flow verified')
          EOF
