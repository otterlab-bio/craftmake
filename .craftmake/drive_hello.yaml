schema_version: craftmake.action/v1
name: drive_hello
backend: colab
colab:
  session: gpu
  drive_root: /content/drive/MyDrive/craftmake
  # Mounting Drive is what makes /content/drive real. `rclone` is the mode that
  # works with a Drive-scoped credential; it needs `craftmake colab drive login
  # --session gpu` first, and it is a *required* mount: if it does not come up,
  # the task fails instead of writing to the ephemeral VM disk.
  drive_mount: rclone
jobs:
  drive_test:
    steps:
      - run: |
          python3 - << 'EOF'
          import os
          import sys
          from pathlib import Path

          # Belt and braces: with colab.drive_mount set, craftmake already fails
          # the task when the mount did not come up. Keep the check anyway, since
          # any action that writes to /content/drive should verify the path is
          # real rather than trust it: over a bare kernel WebSocket
          # google.colab.drive.mount() cannot work, and a write to an unmounted
          # path would silently land on the ephemeral VM disk instead of Drive.
          if not os.path.ismount('/content/drive'):
              print(
                  'ERROR: /content/drive is not mounted, so anything written here would be '
                  'lost with the ephemeral VM. Set colab.drive_mount: rclone (with a Drive '
                  'credential from `craftmake colab drive login`) to make the path real, or '
                  'use colab.drive_transport: rest / colab.sync_out to keep results.',
                  file=sys.stderr,
              )
              sys.exit(2)

          drive_dir = Path('/content/drive/MyDrive/craftmake')
          drive_dir.mkdir(parents=True, exist_ok=True)

          hello_file = drive_dir / 'helloworld.txt'
          hello_file.write_text('helloworld from craftmake colab!')
          print('Created cloud file:', hello_file)
          print('File content:', hello_file.read_text().strip())

          # Writes through the mount are buffered and uploaded afterwards; the
          # task finalizer waits for that queue to drain before releasing the
          # mount, so nothing has to be flushed here.
          EOF
