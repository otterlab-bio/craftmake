  - sample-b
mode: RRBS
species1: human
species2: mouse
jobid: beaverpdx-step1-fixture
userid: fixture-user
input:
  fastq_dir: data
  suffix: _R1.fastq.gz
  suffix2: _R2.fastq.gz
output:
