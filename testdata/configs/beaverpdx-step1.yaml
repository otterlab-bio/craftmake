    seq1:
      - AGATCGGAAGAGC
      - NO_ADAPTER_CAL_USE_DEFAULT
    seq2:
      - AGATCGGAAGAGC
      - NO_ADAPTER_CAL_USE_DEFAULT
metadata:
  sample_ids:
    - sample-a
    - sample-b
  user_email: fixture@example.invalid
reference:
  files:
    fasta:
      - references/human.fasta
      - references/mouse.fasta
  indices:
    genome:
      - references/bismark-human
      - references/bismark-mouse
